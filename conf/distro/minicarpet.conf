# conf/distro/minicarpet.conf

require conf/distro/poky.conf

DISTRO = "minicarpet"
DISTRO_NAME = "Minicarpet OS"
DISTRO_CODENAME = "minicarpet"

LICENSE_FLAGS_ACCEPTED += " commercial synaptics-killswitch"

# Minicarpet uses systemd exclusively.
INIT_MANAGER = "systemd"

# Build Debian packages and use APT/dpkg when package-management is enabled
# by an image.
PACKAGE_CLASSES = "package_deb"

# Use a conventional persistent sshd daemon rather than Wrynose's default
# per-connection socket activation. sshd.service waits for sshdgenkeys.service,
# so every freshly flashed device generates its own host key on first boot.
PACKAGECONFIG:remove:pn-openssh = "systemd-sshd-socket-mode"
PACKAGECONFIG:append:pn-openssh = " systemd-sshd-service-mode"

# SWUpdate is currently invoked explicitly (swupdate -i ...). Do not start its
# daemon/socket automatically without a daemon configuration.
SYSTEMD_AUTO_ENABLE:pn-swupdate = "disable"

# Start from an explicit minimal distro feature set on Wrynose.
DISTRO_FEATURES_OPTED_OUT = "*"
DISTRO_FEATURES = " \
    alsa \
    ipv4 \
    ipv6 \
    pci \
    pni-names \
    seccomp \
    systemd \
    usbhost \
    usrmerge \
    wifi \
    virtualization \
"
