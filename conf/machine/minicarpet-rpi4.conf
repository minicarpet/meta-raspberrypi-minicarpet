require conf/machine/raspberrypi4-64.conf

# Boot through U-Boot so SWUpdate can select rootfs A/B through rootpart.
RPI_USE_U_BOOT = "1"

# meta-raspberrypi normally adds a fixed root=/dev/mmcblk0p2. The custom
# U-Boot script adds root=/dev/mmcblk0p${rootpart} dynamically instead.
CMDLINE_ROOTFS = ""

# Enable systemd predictable network interface naming.
CMDLINE_IFNAMES = ""

# Keep one kernel per rootfs slot on the shared FAT partition. The upstream
# unsuffixed kernel is retained, while these two copies are used by the A/B
# boot script.
RPI_EXTRA_IMAGE_BOOT_FILES:append = " \
    ${KERNEL_IMAGETYPE};${KERNEL_IMAGETYPE}.A \
    ${KERNEL_IMAGETYPE};${KERNEL_IMAGETYPE}.B \
"

SWUPDATE_HWBOARD = "minicarpet-rpi4"
SWUPDATE_HWREV = "1.0"
